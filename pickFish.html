<script id="fishing-progression">
/* Pure progression model. Embedded in pickFish.html so the game stays self-contained. */
(() => {
 'use strict';
 const FISH=[
  {id:'crucian',name:'小鲫鱼',rarity:'普通',tier:0,color:'#a8d8a8',weight:30,gold:4,tension:58,prog:54,length:[10,24],latin:'Carassius spp. · 鲫属游戏泛称',bio:'体形侧扁，常生活在池塘、湖泊及缓流水域，取食小型水生动物和植物性食物。',nutrition:'作为鱼类，可提供膳食蛋白。本条不提供该鱼的定量营养表，不能用体型或游戏稀有度判断实际营养含量。',sources:[['FAO 鲫鱼资料','https://www.fao.org/fishery/culturedspecies/Carassius_carassius/en'],['FDA 鱼类营养资料','https://www.fda.gov/media/70799/download']]},
  {id:'bluegill',name:'蓝鳃太阳鱼',rarity:'普通',tier:0,color:'#7fb2e5',weight:24,gold:6,tension:64,prog:50,length:[12,28],latin:'Lepomis macrochirus',bio:'北美淡水太阳鱼，身体高而侧扁，口较小。鳃盖附近的深色斑与体侧条纹，是图样中的识别线索。',nutrition:'本条展示鱼类作为蛋白来源的一般特点；未收录该物种经核对的定量营养数据，不将其他鱼种的成分数值套用到它身上。',sources:[['USFWS 蓝鳃太阳鱼','https://www.fws.gov/species/bluegill-lepomis-macrochirus'],['FDA 鱼类营养资料','https://www.fda.gov/media/70799/download']]},
  {id:'bass',name:'大口黑鲈',rarity:'普通',tier:0,color:'#8a9b6e',weight:18,gold:9,tension:70,prog:45,length:[22,52],latin:'Micropterus salmoides',bio:'淡水捕食性鱼类，常出现在有水草或遮蔽物的湖泊、池塘和缓流水域。大嘴和深色体侧带是其图样特征。',nutrition:'参考鲈鱼类的一般营养特点：可提供蛋白，长链 Omega-3 通常少于鲑鱼等高脂冷水鱼。具体成分会随鱼种、饲养及加工方式变化。',sources:[['USFWS 大口黑鲈','https://www.fws.gov/species/largemouth-bass-micropterus-salmoides'],['NIH Omega-3 资料','https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/']]},
  {id:'trout',name:'虹鳟',rarity:'稀有',tier:1,color:'#e08a7a',weight:12,gold:18,tension:75,prog:40,length:[25,55],latin:'Oncorhynchus mykiss',bio:'常见于凉爽、含氧较丰富的淡水环境，也是重要的养殖鱼。粉红体侧带与细小斑点，是鱼样的主要特征。',nutrition:'资料示例：法国鲜虹鳟鱼片每100克约含蛋白质19.1克、脂肪6克、能量136千卡、Omega-3 1718毫克。该示例不代表所有虹鳟或烹调后的数值。',sources:[['EUMOFA 虹鳟物种与营养资料','https://fishery-aquaculture-market-observatory.ec.europa.eu/en/country-and-species-profiles/species-profiles/rainbow-trout'],['爱尔兰 BIM 营养手册','https://bim.ie/wp-content/uploads/2021/03/BIM-Seafood-Nutrition-Handbook-Final.pdf']]},
  {id:'eel',name:'电鳗',rarity:'稀有',tier:1,color:'#b48ae0',weight:8,gold:26,tension:72,prog:36,length:[55,130],latin:'Electrophorus electricus',bio:'南美洲的电鱼，虽俗称“鳗”，分类上并不属于真鳗。身体细长，可用电信号感知环境，图样中的电弧为风格化表现。',nutrition:'本图鉴将电鳗作为生态观察条目，未列食用营养数值。它并非普通食用鳗鱼，不套用鳗鱼的营养成分表。',sources:[['美国国家水族馆 电鳗','https://aqua.org/explore/animals/electric-eel']]},
  {id:'gold-carp',name:'黄金鲤鱼',rarity:'史诗',tier:2,color:'#f0c84b',weight:5,gold:60,tension:80,prog:32,length:[32,66],latin:'游戏变体 · 参考鲤鱼形态',bio:'游戏中的金色鲤鱼变体，保留鲤鱼较厚的嘴唇、口边须及鳞片。现实中也有供观赏的金色鲤鱼，但这里的稀有度与能力属于游戏设定。',nutrition:'金色和稀有度不代表更高营养。本条不为游戏变体编造营养数值；现实鲤鱼的成分需按具体品种与食物资料查询。',sources:[['FAO 普通鲤鱼形态与养殖资料','https://www.fao.org/fishery/docs/CDrom/aquaculture/I1129m/file/en/en_commoncarp.htm']]},
  {id:'koi-king',name:'锦鲤王',rarity:'传说',tier:3,color:'#ff6b9d',weight:2,gold:180,tension:86,prog:27,length:[50,95],latin:'虚构王者 · 参考观赏锦鲤',bio:'本作的终章传说鱼。白底红黑斑纹参考观赏锦鲤，皇冠与“王者”身份属于虚构表现，并非一个真实的新物种。',nutrition:'观赏与虚构条目，不设食用营养数值。图鉴中的稀有度、金币及升级用途均为游戏规则，与现实营养价值无关。',sources:[['新西兰 DOC 锦鲤资料','https://www.doc.govt.nz/nature/pests-and-threats/freshwater-pests/koi-carp/']]}
 ];
 const BY_ID=Object.fromEntries(FISH.map(f=>[f.id,f]));
 const AREAS=[
  {id:'pond',name:'晨光池塘',subtitle:'01 · 学会与鱼相处',description:'平静水面，宽松咬钩窗口。收集普通鱼，先兑换第一套钓具和船只升级。',colors:['#163d50','#102536'],fish:['crucian','bluegill','bass'],weights:[45,35,20],current:0,tension:1,bite:1.3,goal:5,rareGoal:0,rod:1,boat:1,reward:25},
  {id:'river',name:'回旋溪流',subtitle:'02 · 寻找第一条虹鳟',description:'水流开始推动小船，鱼的拉力变强。留意更短的刺鱼时机，用虹鳟换取进阶配件。',colors:['#174c64','#0c2c45'],fish:['crucian','bluegill','bass','trout'],weights:[20,20,30,30],current:18,tension:1.12,bite:1.05,goal:6,rareGoal:1,rod:2,boat:1,reward:55},
  {id:'wetland',name:'迷雾湿地',subtitle:'03 · 电鱼与金色鳞光',description:'雾气与摆动水流增加挑战。电鳗和黄金鲤鱼登场，升级船只能减轻漂移。',colors:['#244b4e','#102b32'],fish:['crucian','bass','eel','gold-carp'],weights:[25,30,35,10],current:32,tension:1.25,bite:.9,goal:8,rareGoal:2,rod:2,boat:2,reward:100},
  {id:'deep',name:'风暴深潭',subtitle:'04 · 锦鲤王的试炼',description:'浪涌、强拉力与短咬钩窗口。高级钓具和船只更从容，完成终章后可返回任何水域继续收集。',colors:['#222c57','#0b1833'],fish:['bass','trout','eel','gold-carp','koi-king'],weights:[25,25,25,15,10],current:48,tension:1.42,bite:.75,goal:10,rareGoal:3,legendGoal:1,rod:2,boat:2,reward:220}
 ];
 const zeros=()=>Object.fromEntries(FISH.map(f=>[f.id,0]));
 const create=()=>({version:1,gold:0,caught:0,inventory:zeros(),discovered:zeros(),best:zeros(),rod:0,boat:0,zone:0,cleared:[false,false,false,false],zoneCatch:[0,0,0,0],zoneRare:[0,0,0,0],zoneLegend:[0,0,0,0],dry:[0,0,0,0],recentTokens:[]});

 function chooseFish(state,rng=Math.random){const water=area(state);if(state.zone===3&&state.zoneCatch[3]>=7&&state.zoneLegend[3]===0)return BY_ID['koi-king'];if(state.zone>0&&state.dry[state.zone]>=3)return BY_ID[water.fish.find(id=>BY_ID[id].tier===1)];let point=rng()*water.weights.reduce((a,b)=>a+b,0);for(let i=0;i<water.fish.length;i++){point-=water.weights[i];if(point<0)return BY_ID[water.fish[i]];}return BY_ID[water.fish[water.fish.length-1]];}
 function catchFish(state,id,token,rng=Math.random){const fish=BY_ID[id];if(!fish||!area(state).fish.includes(id)||typeof token!=='string'||!token||token.length>160||state.recentTokens.includes(token))return {ok:false,message:'这份钓获已结算，或不属于当前水域。'};

 function travel(state,index){if(!Number.isInteger(index)||index<0||index>unlocked(state))return {ok:false,message:'请先通关前一个水域。'};state.zone=index;return {ok:true,message:'已抵达'+area(state).name};}
 function goals(state){const water=area(state),z=state.zone;return [{name:'本水域钓获',value:state.zoneCatch[z],target:water.goal},{name:'稀有及以上',value:state.zoneRare[z],target:water.rareGoal},{name:'钓具等级',value:state.rod,target:water.rod},{name:'船只等级',value:state.boat,target:water.boat},...(water.legendGoal?[{name:'本水域锦鲤王',value:state.zoneLegend[z],target:1}]:[])].filter(g=>g.target>0);}
 function complete(state){if(state.cleared[state.zone])return {ok:false,message:'本水域奖励已领取。'};if(!goals(state).every(g=>g.value>=g.target))return {ok:false,message:'还有水域目标未完成。'};state.cleared[state.zone]=true;state.gold+=area(state).reward;return {ok:true,message:'通关'+area(state).name+'！奖励 +'+area(state).reward+' 金币'+(state.zone===3?'，全部水域已通关！':'，下一个水域已解锁。')};}
 function restore(raw){try{const value=typeof raw==='string'?JSON.parse(raw):raw;if(!value||value.version!==1)return null;const integer=(n,min,max)=>Number.isInteger(n)&&n>=min&&n<=max;
  if(!integer(value.gold,0,1e9)||!integer(value.caught,0,1e6)||!integer(value.rod,0,3)||!integer(value.boat,0,3)||!integer(value.zone,0,3))return null;
  for(const key of ['inventory','discovered','best']){if(!value[key]||Object.keys(value[key]).length!==FISH.length)return null;for(const fish of FISH){const n=value[key][fish.id];if(key==='best'){if(typeof n!=='number'||!Number.isFinite(n)||n<0||n>1000)return null;}else if(!integer(n,0,1e6))return null;}}
  if(FISH.some(f=>value.inventory[f.id]>value.discovered[f.id]||(value.discovered[f.id]===0)!==(value.best[f.id]===0)))return null;
  for(const key of ['zoneCatch','zoneRare','zoneLegend','dry'])if(!Array.isArray(value[key])||value[key].length!==4||value[key].some(n=>!integer(n,0,1e6)))return null;

  if(value.zoneRare.some((n,i)=>n>value.zoneCatch[i])||value.zoneLegend.some((n,i)=>n>value.zoneRare[i])||value.dry.some((n,i)=>n>value.zoneCatch[i]))return null;
  if(value.zoneRare.reduce((a,b)=>a+b,0)!==FISH.filter(f=>f.tier>0).reduce((a,f)=>a+value.discovered[f.id],0)||value.zoneLegend.reduce((a,b)=>a+b,0)!==value.discovered['koi-king'])return null;
  if(!Array.isArray(value.recentTokens)||value.recentTokens.length>64||value.recentTokens.some(t=>typeof t!=='string'||!t||t.length>160)||new Set(value.recentTokens).size!==value.recentTokens.length)return null;
  const result=create();for(const key of Object.keys(result))result[key]=JSON.parse(JSON.stringify(value[key]));return result;
 }catch(_){return null;}}

<script>
(() => {
'use strict';
const FP=FishingProgress,SAVE_KEY='chenchen-fishing-adventure-v1';
let progress=FP.create(),saveNotice='自动保存在本机浏览器',adventureTab='bag',panelResume=false,castSerial=0;
try{const saved=localStorage.getItem(SAVE_KEY);if(saved){const restored=FP.restore(saved);if(restored)progress=restored;else saveNotice='旧存档无法读取，已建立新旅程；新钓获后将保存新进度。';}}catch(error){saveNotice='保存失败：浏览器未允许本地存储，本局进度仅保留在页面。';}
const castToken=()=>Date.now().toString(36)+'-'+(++castSerial)+'-'+Math.random().toString(36).slice(2);

// ============================================================
//  基础设置
// ============================================================
let W = 960, H = 540;
const canvas = document.getElementById('game');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;
let waterGradient=null,drawDirty=true,cameraReady=false;

function resize() {
 const mobile=matchMedia('(pointer:coarse)').matches||innerWidth<=700,portrait=innerHeight>innerWidth&&innerWidth<=700;
 const headerHeight=innerWidth<=700?118:108;
 const availableHeight=Math.max(100,innerHeight-headerHeight-(mobile?(portrait?165:35):85)),availableWidth=Math.max(280,innerWidth-(mobile&&!portrait?280:0));
 W=portrait?540:960;H=portrait?Math.max(540,Math.min(860,availableHeight/availableWidth*W)):540;
 const scale=Math.max(.1,Math.min(availableWidth/W,availableHeight/H)),ratio=Math.min(2,Math.max(.5,(devicePixelRatio||1)*scale));
 canvas.style.width=W*scale+'px';canvas.style.height=H*scale+'px';canvas.style.position='absolute';canvas.style.left='50%';canvas.style.top=(headerHeight+availableHeight/2)+'px';canvas.style.transform='translate(-50%,-50%)';
 const width=Math.round(W*ratio),height=Math.round(H*ratio);
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
 ctx.setTransform(width/W,0,0,height/H,0,0);ctx.imageSmoothingEnabled=true;waterGradient=null;drawDirty=true;if(cameraReady)updateCamera();
}
window.addEventListener('resize', resize);
resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);

// ============================================================
//  音效（WebAudio 合成）
// ============================================================
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx && actx.state === 'suspended') actx.resume().catch(()=>{});
}
function beep(freq, dur, type, vol) {
  if (!actx) return;
  try {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

// ============================================================
//  世界 & 玩家
// ============================================================
const WORLD = { w: 1920, h: 1080 };
const cam  = { x: 0, y: 0 };
const boat = { x: 960, y: 540, vx: 0, vy: 0, bob: 0 };

const keys  = {};
const mouse = { x: W / 2, y: H / 2 };
let paused=false,touchReeling=false;const touchMoves=new Map(),reelPointers=new Set(),touchReelPointers=new Set();
let isRightMouseDown = false; // 新增：鼠标右键状态

// 粒子系统
const particles = [];
function spawnParticle(x, y, vx, vy, life, color, size) {
  particles.push({ x, y, vx, vy, life, maxLife: life, color, size });
}
function spawnSplash(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = rnd(0, Math.PI * 2);
    const speed = rnd(20, 60);
    spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 30, rnd(0.3, 0.6), 'rgba(200,240,255,0.8)', rnd(1, 3));
  }
}

// ============================================================
//  鱼类数据
// ============================================================
const FISH_TYPES = FP.FISH;
const RARITY_COLOR = {
  '普通': '#cfd8e3',
  '稀有': '#5dade2',
  '史诗': '#bb8fce',
  '传说': '#f7dc6f',
};

function pickFish(){return FP.chooseFish(progress);}

// ============================================================
//  游戏状态
// ============================================================
const game = {
  mode: 'idle',          // idle | casting | waiting | bite | reeling | result
  time: 0,
  gold: progress.gold,
  caught: progress.caught,
  castToken: "",
  msg: '',
  msgTimer: 0,
  waitTimer: 0,
  biteTimer: 0,
  biteFish: null,
  reeling: null,
  result: null,
  resultTimer: 0,
  float: { x: 0, y: 0, sx: 0, sy: 0, ex: 0, ey: 0, t: 0, dur: 0.4, z: 0 },
};

// ============================================================
//  场景装饰
// ============================================================
const decor = [];
function genDecor() {
  decor.length=0;
  for (let i = 0; i < 180; i++) {
    const x = rnd(20, WORLD.w - 20);
    const y = rnd(20, WORLD.h - 20);
    if (Math.hypot(x - boat.x, y - boat.y) < 150) continue;
    const r = Math.random();
    let type = 'lily';
    if (r > 0.8) type = 'rock';
    else if (r > 0.6) type = 'weed';
    decor.push({
      x, y, type,
      s: rnd(0.8, 1.6),
      ph: Math.random() * Math.PI * 2,
    });
  }
}
genDecor();

// ============================================================
//  输入控制
// ============================================================
function onAction() {
  if(paused)return;initAudio();
  if (game.mode === 'idle') {
    castLine();
  } else if (game.mode === 'bite') {
    startReel();
  }
}

function clearInput(){for(const key of Object.keys(keys))delete keys[key];touchMoves.clear();reelPointers.clear();touchReelPointers.clear();isRightMouseDown=false;touchReeling=false;boat.vx=0;boat.vy=0;}
function setPaused(value){paused=value;drawDirty=true;if(paused)clearInput();$('fishPause').textContent=paused?'继续':'暂停';$('fishPause').setAttribute('aria-pressed',String(paused));syncControls();}
const $=id=>document.getElementById(id);
let controlsKey='';
function syncControls(){const nextKey=game.mode+'|'+paused;if(nextKey===controlsKey)return;controlsKey=nextKey;if(game.mode!=='reeling'){touchReelPointers.clear();touchReeling=false;}const labels={idle:'抛竿',casting:'正在抛竿',waiting:'等待咬钩',bite:'刺鱼！',reeling:'收线中',result:'查看钓获'};$('fishAction').textContent=labels[game.mode];$('fishAction').disabled=paused||!['idle','bite'].includes(game.mode);$('fishReel').disabled=paused||game.mode!=='reeling';$('fishStatus').textContent=paused?'已暂停 · 点“继续”恢复，进度保留':game.mode==='reeling'?'按住右键 / E / 收线按钮，松开让张力回落':game.mode==='bite'?'咬钩了！点击湖面、刺鱼按钮或按空格！':'WASD / 方向键或方向按钮驾驶 · 点击湖面瞄准抛竿';}
window.addEventListener('keydown',e=>{if($('fishPanel').open||$('resetJourney').open)return;if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(/^(BUTTON|A)$/.test(e.target.tagName)&&['Space','Enter'].includes(e.code))return;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(e.repeat)return;keys[e.key.toLowerCase()]=true;if(e.code==='Space')onAction();if(e.code==='KeyP')setPaused(!paused);});
window.addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()];});
function updateMousePos(e){const rect=canvas.getBoundingClientRect();mouse.x=(e.clientX-rect.left)/rect.width*W;mouse.y=(e.clientY-rect.top)/rect.height*H;}
canvas.addEventListener('pointermove',updateMousePos);
canvas.addEventListener('pointerdown',e=>{if(paused)return;e.preventDefault();updateMousePos(e);initAudio();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);if(e.button===2){reelPointers.add(e.pointerId);isRightMouseDown=true;}else if(e.button===0)onAction();syncControls();});
function releaseCanvas(e){reelPointers.delete(e.pointerId);isRightMouseDown=reelPointers.size>0;}
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,releaseCanvas);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
for(const button of document.querySelectorAll('[data-move]')){
 button.addEventListener('pointerdown',e=>{if(paused)return;e.preventDefault();button.setPointerCapture(e.pointerId);touchMoves.set(e.pointerId,button.dataset.move);});
 const release=e=>touchMoves.delete(e.pointerId);for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,release);
}
$('fishAction').onclick=()=>{onAction();syncControls()};$('fishPause').onclick=()=>setPaused(!paused);
$('fishReel').addEventListener('pointerdown',e=>{if(paused||game.mode!=='reeling')return;e.preventDefault();$('fishReel').setPointerCapture(e.pointerId);touchReelPointers.add(e.pointerId);touchReeling=true;});
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('fishReel').addEventListener(type,e=>{touchReelPointers.delete(e.pointerId);touchReeling=touchReelPointers.size>0});
$('fishReel').addEventListener('keydown',e=>{if(['Space','Enter'].includes(e.code)){e.preventDefault();if(!paused){touchReelPointers.add('keyboard');touchReeling=true}}});
$('fishReel').addEventListener('keyup',e=>{if(['Space','Enter'].includes(e.code)){touchReelPointers.delete('keyboard');touchReeling=touchReelPointers.size>0}});$('fishReel').addEventListener('blur',()=>{touchReelPointers.delete('keyboard');touchReeling=touchReelPointers.size>0});
window.addEventListener('blur',()=>{panelResume=false;setPaused(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden){panelResume=false;setPaused(true)}last=performance.now();});
function held(key){return keys[key]||[...touchMoves.values()].includes(key);}


// ============================================================
//  钓鱼流程
// ============================================================
function rodTip() {
  return { x: boat.x + 10, y: boat.y - 28 };
}

function castLine() {
  game.castToken=castToken();
  const tip = rodTip();
  const tx = mouse.x + cam.x;
  const ty = mouse.y + cam.y;

  let dx = tx - tip.x;
  let dy = ty - tip.y;
  let dist = Math.hypot(dx, dy);
  const MAXD = FP.modifiers(progress).cast;
  if (dist > MAXD) { dx *= MAXD / dist; dy *= MAXD / dist; dist = MAXD; }
  if (dist < 50) { dx = 0; dy = -50; dist = 50; }

  const f = game.float;
  f.sx = tip.x; f.sy = tip.y;
  f.ex = clamp(tip.x + dx,20,WORLD.w-20); f.ey = clamp(tip.y + dy,20,WORLD.h-20);
  f.t = 0;
  f.dur = 0.32 + dist / 1000;
  f.x = tip.x; f.y = tip.y; f.z = 0;

  game.mode = 'casting';
  beep(320, 0.07, 'square', 0.035);
}

function startReel() {
  if(!game.castToken)game.castToken=castToken();
  const fish = game.biteFish || pickFish();
  game.reeling = { fish, prog: 0, tension: 0 };
  game.mode = 'reeling';
  spawnSplash(game.float.ex, game.float.ey, 15);
  beep(700, 0.06, 'square', 0.05);
  setTimeout(() => beep(950, 0.08, 'square', 0.045), 70);
}

// ============================================================
//  更新逻辑
// ============================================================
function updateBoat(dt) {
  const anchored = game.mode !== 'idle';
  let ix = 0, iy = 0;
  if (!anchored) {
    if (held('w') || held('arrowup'))    iy -= 1;
    if (held('s') || held('arrowdown'))  iy += 1;
    if (held('a') || held('arrowleft'))  ix -= 1;
    if (held('d') || held('arrowright')) ix += 1;
  }
  const len = Math.hypot(ix, iy) || 1;
  const modifiers=FP.modifiers(progress),water=FP.area(progress),SPEED=modifiers.speed;
  const drift=anchored?0:water.current*modifiers.stability;
  const tvx=ix/len*SPEED+Math.sin(game.time*.8)*drift;
  const tvy=iy/len*SPEED+Math.cos(game.time*.65)*drift*.6;
  boat.vx += (tvx - boat.vx) * Math.min(1, dt * 8);
  boat.vy += (tvy - boat.vy) * Math.min(1, dt * 8);

  boat.x = clamp(boat.x + boat.vx * dt, 60, WORLD.w - 60);
  boat.y = clamp(boat.y + boat.vy * dt, 60, WORLD.h - 60);
  boat.bob += dt * (1 + Math.hypot(boat.vx, boat.vy) * 0.02);

  if (Math.hypot(boat.vx, boat.vy) > 20 && Math.random() < 1-Math.exp(-18*dt)) {
    spawnParticle(boat.x - boat.vx * 0.1, boat.y - boat.vy * 0.1 + 10, rnd(-10, 10), rnd(-5, 15), 0.6, 'rgba(150,220,255,0.4)', rnd(1, 3));
  }
}

function updateCamera() {
  cam.x = Math.round(clamp(boat.x - W / 2, 0, WORLD.w - W));
  cam.y = Math.round(clamp(boat.y - H / 2, 0, WORLD.h - H));
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 60 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateFishing(dt) {
  const f = game.float;

  switch (game.mode) {
    case 'idle':
      break;

    case 'casting': {
      f.t += dt / f.dur;
      const p = Math.min(1, f.t);
      f.x = lerp(f.sx, f.ex, p);
      f.y = lerp(f.sy, f.ey, p);
      f.z = Math.sin(p * Math.PI) * 45;
      if (p >= 1) {
        f.z = 0;
        game.mode = 'waiting';
        game.waitTimer = rnd(1.1, 3.0);
        spawnSplash(f.ex, f.ey, 8);
        beep(170, 0.09, 'sine', 0.035);
      }
      break;
    }

    case 'waiting': {
      game.waitTimer -= dt;
      f.x = f.ex + Math.sin(game.time * 2.2) * 2.5;
      f.y = f.ey + Math.cos(game.time * 1.8) * 2.5;
      if (game.waitTimer <= 0) {
        game.mode = 'bite';
        game.biteTimer = FP.area(progress).bite+progress.rod*.05;
        game.biteFish = pickFish();
        beep(880, 0.06, 'square', 0.05);
        setTimeout(() => beep(1180, 0.07, 'square', 0.05), 75);
      }
      break;
    }

    case 'bite': {
      game.biteTimer -= dt;
      f.x = f.ex + Math.sin(game.time * 26) * 4;
      f.y = f.ey + Math.cos(game.time * 22) * 4 + 4;
      if (game.biteTimer <= 0) {
        game.mode = 'idle';
        game.msg = '鱼跑掉了…';
        game.msgTimer = 1.4;
        game.biteFish = null;
        beep(150, 0.18, 'sawtooth', 0.04);
      }
      break;
    }

    case 'reeling': {
      const r = game.reeling;
      // 核心修改：按住右键收线
      const holding = isRightMouseDown || keys.e || touchReeling;

      if (holding) {
        const modifiers=FP.modifiers(progress),water=FP.area(progress);
        const surge=progress.zone>1?1+.1*Math.sin(game.time*3):1;
        r.tension += r.fish.tension*water.tension*modifiers.tension*surge*dt;
        r.prog += r.fish.prog*modifiers.progress*dt;
        if (Math.random() < 1-Math.exp(-12*dt)) {
            spawnParticle(f.ex + rnd(-10, 10), f.ey + rnd(-10, 10), rnd(-20,20), rnd(-20,20), 0.4, 'rgba(255,255,255,0.6)', 1.5);
        }
      } else {
        r.tension -= FP.modifiers(progress).recovery * dt;
        r.prog -= 10/(1+progress.rod*.15)*dt;
      }
      r.tension = clamp(r.tension, 0, 100);
      r.prog    = clamp(r.prog, 0, 100);

      f.x = f.ex + (Math.random() - 0.5) * (r.tension > 55 ? 6 : 2);
      f.y = f.ey + (Math.random() - 0.5) * (r.tension > 55 ? 6 : 2);

      if (r.tension >= 100) {
        game.mode = 'result';
        game.result = { fish: r.fish, success: false };
        game.resultTimer = 1.8;
        spawnSplash(f.ex, f.ey, 20);
        beep(110, 0.32, 'sawtooth', 0.06);
      } else if (r.prog >= 100) {
        game.mode = 'result';
        const award=FP.catchFish(progress,r.fish.id,game.castToken);
        game.result = {fish:r.fish,success:award.ok,length:award.length};
        game.resultTimer = 2.8;
        if(award.ok){saveProgress();if(FP.goals(progress).every(g=>g.value>=g.target)&&!progress.cleared[progress.zone])announce('水域目标已达成！打开水域航图领取通关奖励。');}
        else announce(award.message);
        spawnSplash(f.ex, f.ey, 30);
        beep(660, 0.09, 'square', 0.05);
        setTimeout(() => beep(880, 0.10, 'square', 0.05), 95);
        setTimeout(() => beep(1320, 0.16, 'square', 0.05), 210);
      }
      break;
    }

    case 'result': {
      game.resultTimer -= dt;
      if (game.resultTimer <= 0) {
        game.mode = 'idle';
        game.result = null;
        game.reeling = null;
        game.biteFish = null;game.castToken="";
      }
      break;
    }
  }

  if (game.msgTimer > 0) game.msgTimer -= dt;
}

function update(dt) {
  game.time += dt;
  updateBoat(dt);
  updateCamera();
  updateParticles(dt);
  updateFishing(dt);
}

// ============================================================
//  渲染部分
// ============================================================
function drawWater() {
  if(!waterGradient){waterGradient=ctx.createLinearGradient(0,0,0,H);waterGradient.addColorStop(0,FP.area(progress).colors[0]);waterGradient.addColorStop(1,FP.area(progress).colors[1]);}
  ctx.fillStyle=waterGradient;

  ctx.fillRect(0, 0, W, H);

  const t = game.time;
  const step = 40;
  const x0 = Math.floor(cam.x / step) * step;
  const y0 = Math.floor(cam.y / step) * step;

  for (let wy = y0; wy < cam.y + H + step; wy += step) {
    for (let wx = x0; wx < cam.x + W + step; wx += step) {
      const ph = Math.sin(t * 0.8 + wx * 0.03 + wy * 0.05);
      if (ph > 0.3) {
        const px = Math.round(wx - cam.x + Math.sin(t * 1.6 + wy * 0.1) * 15);
        const py = Math.round(wy - cam.y);
        const alpha = (ph - 0.3) * 0.25;
        ctx.fillStyle = `rgba(80,180,240,${alpha})`;
        ctx.beginPath();
        ctx.ellipse(px, py, 30, 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawDecor() {
  for (const d of decor) {
    const x = d.x - cam.x;
    const y = d.y - cam.y;
    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) continue;

    if (d.type === 'lily') {
      const bob = Math.sin(game.time * 1.2 + d.ph) * 2;
      const r = 10 * d.s;
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(x + 2, y + bob + 2, r, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a5434';
      ctx.beginPath(); ctx.ellipse(x, y + bob, r, r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2c8c58';
      ctx.beginPath(); ctx.ellipse(x - 2, y + bob - 2, r * 0.8, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.moveTo(x, y+bob); ctx.lineTo(x+r*0.8, y+bob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y+bob); ctx.lineTo(x-r*0.4, y+bob+r*0.5); ctx.stroke();
    } else if (d.type === 'rock') {
      const r = 12 * d.s;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(x + 3, y + 3, r, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3d4a57';
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5e7082';
      ctx.beginPath(); ctx.ellipse(x - r*0.2, y - r*0.2, r*0.7, r*0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8096a8';
      ctx.beginPath(); ctx.ellipse(x - r*0.4, y - r*0.4, r*0.3, r*0.2, 0, 0, Math.PI * 2); ctx.fill();
    } else if (d.type === 'weed') {
      const sway = Math.sin(game.time * 2 + d.ph) * 4;
      ctx.strokeStyle = '#2d6e4d';
      ctx.lineWidth = 3 * d.s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + sway, y - 15 * d.s, x + sway * 2, y - 30 * d.s);
      ctx.stroke();
      ctx.strokeStyle = '#429c6b';
      ctx.lineWidth = 2 * d.s;
      ctx.beginPath();
      ctx.moveTo(x + 2, y);
      ctx.quadraticCurveTo(x + sway + 5, y - 10 * d.s, x + sway * 2 + 5, y - 20 * d.s);
      ctx.stroke();
    }
  }
}

function drawBoat() {
  const x = Math.round(boat.x - cam.x);
  const y = Math.round(boat.y - cam.y + Math.sin(boat.bob * 2.2) * 2);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 15, 20, 10, 0, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x, y - 24);
  ctx.lineTo(x + 16, y - 6);
  ctx.lineTo(x + 14, y + 18);
  ctx.lineTo(x - 14, y + 18);
  ctx.lineTo(x - 16, y - 6);
  ctx.closePath();
  ctx.fillStyle = '#4a2815';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x, y - 18);
  ctx.lineTo(x + 11, y - 4);
  ctx.lineTo(x + 10, y + 14);
  ctx.lineTo(x - 10, y + 14);
  ctx.lineTo(x - 11, y - 4);
  ctx.closePath();
  ctx.fillStyle = ['#9c5a2a','#a37443','#5d8795','#b6b17c'][progress.boat];
  ctx.fill();

  ctx.fillStyle = '#7a4019';
  ctx.fillRect(x - 10, y + 4, 20, 2);
  ctx.fillRect(x - 9, y + 9, 18, 2);

  const headY = y - 4;
  ctx.fillStyle = '#3a6ea5';
  ctx.beginPath(); ctx.ellipse(x, y + 4, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(x, headY, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.arc(x, headY - 2, 7, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(x - 9, headY - 2, 18, 2);

  ctx.strokeStyle = ['#2b1a10','#bd9c6c','#93c7cf','#ecd28b'][progress.rod];
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 10, y - 24);
  ctx.quadraticCurveTo(x + 20, y - 40, x + 15, y - 48);
  ctx.stroke();
}

function drawFishing() {
  const m = game.mode;
  if (m !== 'casting' && m !== 'waiting' && m !== 'bite' && m !== 'reeling') return;

  const f = game.float;
  let fx = Math.round(f.x - cam.x);
  let fy = Math.round(f.y - cam.y - f.z);

  if (m === 'reeling') {
    const r = game.reeling;
    if (r.tension > 50) {
      fx += Math.round((Math.random() - 0.5) * 4);
      fy += Math.round((Math.random() - 0.5) * 4);
    }
  }

  const rodX = Math.round(boat.x - cam.x + 15);
  const rodY = Math.round(boat.y - cam.y - 48);

  ctx.strokeStyle = m === 'reeling' && game.reeling.tension > 75 ? '#ff4757' : 'rgba(220,240,255,0.8)';
  ctx.lineWidth = m === 'reeling' && game.reeling.tension > 75 ? 2 : 1;
  ctx.beginPath();
  ctx.moveTo(rodX, rodY);
  ctx.lineTo(fx, fy);
  ctx.stroke();

  if (m !== 'casting') {
    ctx.strokeStyle = 'rgba(150,220,255,0.4)';
    ctx.lineWidth = 1.5;
    const rr = 12 + Math.sin(game.time * 4) * 3;
    ctx.beginPath(); ctx.ellipse(fx, fy + 4, rr, rr * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,220,255,0.2)';
    ctx.beginPath(); ctx.ellipse(fx, fy + 4, rr + 10, (rr + 10) * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(fx, fy + 2, 4, 2, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath();
  ctx.moveTo(fx - 4, fy);
  ctx.lineTo(fx + 4, fy);
  ctx.lineTo(fx + 2, fy - 12);
  ctx.lineTo(fx - 2, fy - 12);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ff8a8a';
  ctx.fillRect(fx - 1, fy - 11, 2, 6);

  if (m === 'bite') {
    const bounce = Math.sin(game.time * 20) * 6;
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffe14d';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 8;
    ctx.fillText('!', fx, fy - 24 + bounce);
    ctx.shadowBlur = 0;

    const prog = 1 - game.biteTimer / 0.95;
    const rr2 = 10 + prog * 40;
    ctx.strokeStyle = `rgba(255,225,80,${Math.max(0, game.biteTimer / 0.95)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(fx, fy, rr2, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color.replace('0.8', alpha.toFixed(2)).replace('0.6', alpha.toFixed(2)).replace('0.4', alpha.toFixed(2));
    ctx.beginPath();
    ctx.arc(p.x - cam.x, p.y - cam.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
//  UI 渲染
// ============================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawUI() {
  ctx.textBaseline = 'middle';

  // ---- 金币面板 ----
  const gx = 20, gy = 20, gw = 130, gh = 36;
  ctx.fillStyle = 'rgba(10, 20, 30, 0.75)';
  roundRect(gx, gy, gw, gh, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#f1c40f';
  ctx.beginPath(); ctx.arc(gx + 20, gy + 18, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f8e79a';
  ctx.beginPath(); ctx.arc(gx + 18, gy + 16, 3, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'left';
  ctx.font = 'bold 18px "Segoe UI", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(game.gold), gx + 38, gy + 19);

  // ---- 钓获面板 ----
  const cx = W - 150, cy = 20, cw = 130, ch = 36;
  ctx.fillStyle = 'rgba(10, 20, 30, 0.75)';
  roundRect(cx, cy, cw, ch, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.stroke();

  ctx.textAlign = 'right';
  ctx.font = 'bold 18px "Segoe UI", sans-serif';
  ctx.fillStyle = '#8fd3ff';
  ctx.fillText(String(game.caught), cx + cw - 20, cy + 19);
  ctx.font = '14px "Segoe UI", sans-serif';
  ctx.fillStyle = '#a0b5c8';
  ctx.fillText('钓获', cx + cw - 45, cy + 20);

  // ---- 底部提示 ----
  let hint = '';
  if (game.mode === 'idle')         hint = 'WASD 移动 · 左键/空格 抛竿';
  else if (game.mode === 'waiting') hint = '静静等待…';
  else if (game.mode === 'bite')    hint = '咬钩了！快速左键/空格！';

  if (hint) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px "Segoe UI", sans-serif';
    const tw = ctx.measureText(hint).width;
    const bw = tw + 40, bh = 32;
    const bx = W / 2 - bw / 2, by = H - 50;

    ctx.fillStyle = 'rgba(10, 20, 30, 0.65)';
    roundRect(bx, by, bw, bh, 16);
    ctx.fill();

    ctx.fillStyle = '#d6e6f5';
    ctx.fillText(hint, W / 2, by + bh / 2);
  }

  // ---- 收线 UI ----
  if (game.mode === 'reeling') {
    const r = game.reeling;
    const bw = 360, bh = 12;
    const bx = (W - bw) / 2;
    const by = H - 115;
    const ty = by + 32;

    ctx.fillStyle = 'rgba(10, 20, 30, 0.8)';
    roundRect(bx - 4, by - 4, bw + 8, bh + 8, 6); ctx.fill();
    ctx.fillStyle = '#1a2d40';
    roundRect(bx, by, bw, bh, 6); ctx.fill();
    const pGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
    pGrad.addColorStop(0, '#55efc4');
    pGrad.addColorStop(1, '#00b894');
    ctx.fillStyle = pGrad;
    roundRect(bx, by, Math.max(4, bw * r.prog / 100), bh, 6); ctx.fill();

    ctx.fillStyle = 'rgba(10, 20, 30, 0.8)';
    roundRect(bx - 4, ty - 4, bw + 8, bh + 8, 6); ctx.fill();
    ctx.fillStyle = '#1a2d40';
    roundRect(bx, ty, bw, bh, 6); ctx.fill();
    let tGrad = ctx.createLinearGradient(bx, ty, bx, ty + bh);
    if (r.tension > 75) {
      const flash = Math.sin(game.time * 20) > 0;
      tGrad.addColorStop(0, flash ? '#ff6b6b' : '#ee5253');
      tGrad.addColorStop(1, flash ? '#c0392b' : '#a01d2a');
    } else if (r.tension > 50) {
      tGrad.addColorStop(0, '#ffa726');
      tGrad.addColorStop(1, '#f39c12');
    } else {
      tGrad.addColorStop(0, '#74b9ff');
      tGrad.addColorStop(1, '#0984e3');
    }
    ctx.fillStyle = tGrad;
    roundRect(bx, ty, Math.max(4, bw * r.tension / 100), bh, 6); ctx.fill();

    ctx.textAlign = 'right';
    ctx.font = 'bold 14px "Segoe UI", sans-serif';
    ctx.fillStyle = '#55efc4';
    ctx.fillText('进度', bx - 12, by + bh / 2);
    ctx.fillStyle = '#f39c12';
    ctx.fillText('张力', bx - 12, ty + bh / 2);

    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.fillStyle = RARITY_COLOR[r.fish.rarity] || '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(r.fish.name, W / 2, by - 20);
    ctx.shadowBlur = 0;

    // 修改操作提示文案
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.fillStyle = '#9fb4c7';
    ctx.fillText('按住右键 / E / 收线按钮 · 松开降低张力', W / 2, H - 20);
  }

  if(game.mode==='result'&&game.result)drawCatchResult(game.result);

  if (game.msgTimer > 0 && game.msg) {
    const a = Math.min(1, game.msgTimer / 0.4);
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.fillStyle = `rgba(230,240,250,${a})`;
    ctx.fillText(game.msg, W / 2, H / 2 - 60);
  }
}

function draw() {
  drawWater();
  drawDecor();
  drawAmbientFish();
  drawBoat();
  drawFishing();
  drawParticles();
  drawUI();
}

function drawFishSprite(context,id,x,y,scale=1,time=0){
 const fish=FP.BY_ID[id]||FP.FISH[0],index=FP.FISH.indexOf(fish),c=context;
 c.save();c.translate(x,y);c.scale(scale,scale);c.imageSmoothingEnabled=false;
 const rect=(a,b,w,h,color)=>{c.fillStyle=color;c.fillRect(Math.round(a),Math.round(b),w,h)};
 if(id==='eel'){
  for(let i=0;i<10;i++){const yy=Math.round(Math.sin(i*.75+time)*3);rect(-37+i*7,yy-4,10,8,i%2?'#8566ab':'#b8a1d5');rect(-37+i*7,yy+3,7,2,'#52628c');}
  rect(29,-3,8,9,'#b9a4d7');rect(33,-2,2,2,'#162339');rect(-22,-12,3,5,'#e6d58b');rect(-19,-9,5,2,'#e6d58b');rect(10,10,3,5,'#e6d58b');
 }else{
  const slim=id==='trout'||id==='bass',height=slim?8:12,bodyColor=id==='koi-king'?'#e4e6df':fish.color;
  rect(-34,-11,6,22,index===5?'#c77a3f':'#5b8fa2');rect(-28,-8,7,16,bodyColor);rect(-22,-height+3,45,height*2-6,bodyColor);rect(-16,-height,32,height*2,bodyColor);rect(16,-height+4,11,height*2-8,bodyColor);rect(24,-4,5,8,bodyColor);
  rect(-9,-height-5,14,5,id==='trout'?'#b76173':'#6798a1');rect(-3,height-1,12,5,index===5?'#d38b41':'#6d90a6');
  rect(-13,-height+2,23,3,id==='koi-king'?'#fff3d6':'#d1e8cf');
  if(id==='bluegill'){for(let i=-13;i<12;i+=6)rect(i,-7,2,16,'#4e86b3');rect(13,-6,5,8,'#253a60');rect(5,6,7,4,'#d8a75d');}
  else if(id==='bass'){rect(-18,-1,40,4,'#435e4d');rect(23,1,7,3,'#263a38');}
  else if(id==='trout'){rect(-18,1,40,3,'#d66587');for(let i=0;i<13;i++)rect(-15+(i*13)%34,-6+(i*7)%12,2,2,'#4b6372');}
  else if(id==='gold-carp'){for(let row=-5;row<=5;row+=5)for(let col=-10;col<15;col+=6)rect(col+(row===0?3:0),row,3,2,'#b78130');rect(23,5,10,1,'#f0d68d');rect(29,5,1,5,'#f0d68d');}
  else if(id==='koi-king'){rect(-13,-8,9,14,'#d96c5a');rect(0,2,12,9,'#dc8f55');rect(14,-4,8,6,'#384a54');rect(-20,3,6,5,'#35454d');rect(-7,-21,3,8,'#e9c36e');rect(0,-24,3,11,'#e9c36e');rect(7,-21,3,8,'#e9c36e');rect(-7,-15,17,3,'#e9c36e');}
  else{for(let i=-12;i<16;i+=7)rect(i,0,2,5,'#7ba188');}
  rect(18,-4,4,4,'#152b36');rect(19,-4,1,1,'#fff5d6');
 }
 c.restore();
}
function fishCanvas(id,width=144,height=76){const c=document.createElement('canvas');c.width=width*2;c.height=height*2;c.style.width=width+'px';c.style.height=height+'px';c.setAttribute('role','img');c.setAttribute('aria-label',FP.BY_ID[id].name+'像素图样');const context=c.getContext('2d');context.scale(2,2);drawFishSprite(context,id,width/2,height/2+2,Math.min(width/96,height/58));return c;}
const htmlEscape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(progress));saveNotice='已自动保存 · 本机浏览器';}catch(error){saveNotice='保存失败：请允许浏览器本地存储，关闭页面将丢失本次进度';}syncAdventure();}
function syncAdventure(){
 const area=FP.area(progress),done=FP.goals(progress).every(g=>g.value>=g.target);
 $('waterName').textContent=area.name+(progress.cleared[progress.zone]?' · 已通关':'');$('waterGoal').textContent='钓获 '+progress.zoneCatch[progress.zone]+'/'+area.goal+(done&&!progress.cleared[progress.zone]?' · 可通关':'');
 const count=Object.values(progress.inventory).reduce((a,b)=>a+b,0);$('bagSummary').textContent=count+' 条';$('openWaters').classList.toggle('ready',done&&!progress.cleared[progress.zone]);
 $('saveNotice').textContent=saveNotice.startsWith('保存失败')?'保存失败':'本机存档';$('saveNotice').title=saveNotice;$('saveStatus').textContent=saveNotice;
 game.gold=progress.gold;game.caught=progress.caught;drawDirty=true;
}
function announce(text){game.msg=text;game.msgTimer=3.5;$('adventureMessage').textContent=text;}
function openAdventure(tab='bag'){
 if(!$('fishPanel').open){panelResume=!paused;setPaused(true);$('fishPanel').showModal();}
 adventureTab=tab;renderAdventure();
}
function renderAdventure(){
 const titles={bag:'我的渔获背包',guide:'鱼类图鉴',workshop:'渔获换装工坊',waters:'水域航图'};$('panelTitle').textContent=titles[adventureTab];
 for(const tab of document.querySelectorAll('[data-panel-tab]'))tab.setAttribute('aria-selected',String(tab.dataset.panelTab===adventureTab));
 const host=$('panelBody');host.replaceChildren();const intro=document.createElement('p');intro.className='panel-intro';host.append(intro);
 if(adventureTab==='bag'||adventureTab==='guide'){
  intro.textContent=adventureTab==='bag'?'每次成功钓获都会自动入包。交付渔获兑换装备后，累计发现和最大尺寸记录仍会保留。':'七种鱼都有独立图样。生物资料与来源可查看；黄金鲤鱼与锦鲤王的稀有度、皇冠等为游戏设定。';
  const fishes=FP.FISH.filter(f=>adventureTab==='guide'||progress.inventory[f.id]>0);
  if(!fishes.length){const empty=document.createElement('div');empty.className='empty-bag';empty.innerHTML='<span>≈</span><h3>背包还没有鱼</h3><p>回到湖面抛竿，咬钩后刺鱼，再交替收线与放松张力。</p><button data-show-guide>先看看鱼类图鉴</button>';host.append(empty);}
  const grid=document.createElement('div');grid.className='fish-card-grid';
  for(const fish of fishes){const card=document.createElement('button');card.className='fish-card';card.dataset.fishDetail=fish.id;card.style.setProperty('--fish-accent',fish.color);card.append(fishCanvas(fish.id));const label=document.createElement('div');label.innerHTML='<span class="rarity">'+fish.rarity+'</span><h3>'+fish.name+'</h3><strong>'+(adventureTab==='bag'?'背包 '+progress.inventory[fish.id]+' 条':progress.discovered[fish.id]?'已发现 · '+progress.discovered[fish.id]+' 条':'尚未钓获')+'</strong><small>最大记录 '+(progress.best[fish.id]?progress.best[fish.id]+' cm':'—')+'</small>';card.append(label);grid.append(card);}host.append(grid);
 }else if(adventureTab==='workshop'){
  intro.textContent='交付鱼换取配件，不消耗史诗或传说鱼。每次兑换前都会列出实际要扣除的鱼与金币。装备属性直接影响湖面上的驾驶和收线。';
  const grid=document.createElement('div');grid.className='upgrade-grid';
  for(const kind of ['rod','boat']){const plan=FP.planUpgrade(progress,kind),level=progress[kind],mods=FP.modifiers(progress),next=FP.modifiers({...progress,[kind]:Math.min(3,level+1)}),card=document.createElement('section');card.className='upgrade-card';
   const benefits=kind==='rod'?['收线效率 '+Math.round(mods.progress*100)+'% → '+Math.round(next.progress*100)+'%','张力增长 '+Math.round(mods.tension*100)+'% → '+Math.round(next.tension*100)+'%','抛竿距离 '+mods.cast+' → '+next.cast]:['航速 '+mods.speed+' → '+next.speed,'水流影响 '+Math.round(mods.stability*100)+'% → '+Math.round(next.stability*100)+'%'];
   card.innerHTML='<span class="upgrade-symbol">'+(kind==='rod'?'⌁':'▰')+'</span><h3>'+(kind==='rod'?'钓具':'船只')+' · Lv.'+level+'</h3><div class="level-dots">'+[1,2,3].map(n=>'<i class="'+(n<=level?'lit':'')+'"></i>').join('')+'</div>'+benefits.map(text=>'<p>'+text+'</p>').join('')+(plan.price?'<div class="recipe">需要普通鱼 '+plan.price.common+' 条'+(plan.price.rare?'、稀有鱼 '+plan.price.rare+' 条':'')+'，金币 '+plan.price.gold+'</div><p class="materials">'+(plan.ok?'将交付：'+plan.items.map(item=>FP.BY_ID[item.id].name+' ×'+item.count).join('、'):plan.message)+'</p><button data-upgrade="'+kind+'" '+(!plan.ok?'disabled':'')+'>交付渔获，升级到 Lv.'+plan.price.level+'</button>':'<div class="recipe">已完成全部升级</div>');grid.append(card);
  }host.append(grid);const balance=document.createElement('p');balance.className='panel-intro';balance.textContent='当前金币 '+progress.gold+' · 普通鱼包括鲫鱼、蓝鳃太阳鱼、大口黑鲈；稀有鱼包括虹鳟、电鳗。';host.append(balance);
 }else{
  intro.textContent='这些水域是游戏关卡集合，并非真实物种分布图。完成当前目标领取一次性奖励，再出发到下一水域；随时可以回到已解锁的水域补充渔获。';
  const grid=document.createElement('div');grid.className='water-grid';
  FP.AREAS.forEach((water,index)=>{const open=index<=FP.unlocked(progress),current=index===progress.zone,activeCast=!['idle','result'].includes(game.mode),card=document.createElement('section');card.className='water-card '+(current?'current':'');card.style.setProperty('--water-color',water.colors[0]);
   card.innerHTML='<span class="water-number">0'+(index+1)+'</span><small>'+water.subtitle+'</small><h3>'+water.name+'</h3><p>'+water.description+'</p><div class="water-pool">'+water.fish.map(id=>'<span>'+FP.BY_ID[id].name+'</span>').join('')+'</div><p class="water-difficulty">水流 '+water.current+' · 拉力 ×'+water.tension+' · 咬钩 '+water.bite+' 秒</p><button data-travel="'+index+'" '+(!open||current||activeCast?'disabled':'')+'>'+(current?'当前水域':!open?'先通关上一水域':activeCast?'完成当前抛竿后出航':'前往水域')+'</button>';
   if(current){const goals=FP.goals(progress),list=document.createElement('ul');list.className='water-goals';for(const goal of goals){const li=document.createElement('li');li.textContent=(goal.value>=goal.target?'✓ ':'○ ')+goal.name+' '+Math.min(goal.value,goal.target)+' / '+goal.target;list.append(li);}card.append(list);const button=document.createElement('button');button.dataset.complete='true';button.disabled=progress.cleared[index]||!goals.every(g=>g.value>=g.target);button.textContent=progress.cleared[index]?'本水域已通关':'完成本水域 · +'+water.reward+' 金币';card.append(button);}else{const note=document.createElement('p');note.className='small-note';note.textContent=progress.cleared[index]?'✓ 已通关':'通关目标：'+water.goal+' 条钓获'+(water.rareGoal?'，稀有及以上 '+water.rareGoal+' 条':'')+'，钓具 Lv.'+water.rod+'，船只 Lv.'+water.boat+(water.legendGoal?'，锦鲤王 1 条':'');card.append(note);}grid.append(card);
  });host.append(grid);if(progress.cleared.every(Boolean)){const trophy=document.createElement('div');trophy.className='campaign-win';trophy.innerHTML='<strong>✦ 湖域探索者</strong><p>四个水域全部通关！继续收集图鉴、刷新最大记录，或回到喜欢的水域。</p>';host.prepend(trophy);}
 }
 syncAdventure();$('fishPanel').scrollTop=0;
}
function showFishDetail(id){const fish=FP.BY_ID[id];if(!fish)return;const host=$('panelBody');host.replaceChildren();const back=document.createElement('button');back.className='detail-back';back.dataset.back='true';back.textContent='← 返回'+(adventureTab==='guide'?'图鉴':'背包');host.append(back);const figure=document.createElement('div');figure.className='fish-detail-art';figure.style.setProperty('--fish-accent',fish.color);figure.append(fishCanvas(id,260,130));host.append(figure);
 const text=document.createElement('article');text.className='fish-detail';text.innerHTML='<span class="rarity">'+fish.rarity+' · '+(fish.tier>=2?'游戏变体':'现实生物参考')+'</span><h3>'+fish.name+'</h3><i>'+fish.latin+'</i><div class="detail-records">背包 '+progress.inventory[id]+' 条 · 累计 '+progress.discovered[id]+' 条 · 最大 '+(progress.best[id]||'—')+' cm</div><h4>生物介绍</h4><p>'+fish.bio+'</p><h4>营养介绍</h4><p>'+fish.nutrition+'</p><p class="small-note">图样为像素化艺术表现。长度记录、关卡分布和装备兑换为游戏数据；营养资料不参与能力或稀有度评分。</p><h4>资料来源</h4><div class="source-links">'+fish.sources.map(([title,url])=>'<a href="'+htmlEscape(url)+'" target="_blank" rel="noopener noreferrer">'+htmlEscape(title)+' ↗</a>').join('')+'</div>';host.append(text);$('fishPanel').scrollTop=0;
}
function applyWater(){const area=FP.area(progress);WORLD.w=1920+progress.zone*260;WORLD.h=1080+progress.zone*160;boat.x=WORLD.w/2;boat.y=WORLD.h/2;boat.vx=boat.vy=0;waterGradient=null;particles.length=0;genDecor();updateCamera();syncAdventure();}
function drawCatchResult(result){const width=360,height=result.success?254:150,x=(W-width)/2,y=(H-height)/2;ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#102539';roundRect(x,y,width,height,14);ctx.fill();ctx.strokeStyle=result.success?'#65bfa9':'#d77f6d';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='center';
 if(result.success){drawFishSprite(ctx,result.fish.id,W/2,y+60,2);ctx.fillStyle=result.fish.color;ctx.font='bold 25px "Segoe UI",sans-serif';ctx.fillText(result.fish.name,W/2,y+112);ctx.fillStyle='#a9c4d2';ctx.font='14px "Segoe UI",sans-serif';ctx.fillText(result.fish.rarity+' · 本次 '+result.length+' cm',W/2,y+144);ctx.fillStyle='#e9cb73';ctx.font='bold 19px "Segoe UI",sans-serif';ctx.fillText('+'+result.fish.gold+' 金币',W/2,y+177);ctx.fillStyle='#b9e2cf';ctx.font='14px "Segoe UI",sans-serif';ctx.fillText('已放入背包 · 可查看图鉴或兑换升级',W/2,y+212);
 }else{ctx.fillStyle='#de8c7a';ctx.font='bold 26px "Segoe UI",sans-serif';ctx.fillText('鱼线断了！',W/2,y+58);ctx.font='14px "Segoe UI",sans-serif';ctx.fillStyle='#adc4d3';ctx.fillText('提前松开收线，让张力回落',W/2,y+103);}
}
function drawAmbientFish(){const ids=FP.area(progress).fish;ctx.save();ctx.globalAlpha=.16;for(let i=0;i<4;i++){const x=WORLD.w*.3+i*170+Math.sin(game.time*.3+i)*90-cam.x,y=WORLD.h*.35+i*90+Math.cos(game.time*.23+i)*30-cam.y;if(x> -60&&x<W+60&&y> -30&&y<H+30)drawFishSprite(ctx,ids[i%ids.length],x,y,.7,game.time);}ctx.restore();}
for(const button of document.querySelectorAll('[data-open-panel]'))button.addEventListener('click',()=>openAdventure(button.dataset.openPanel));
for(const button of document.querySelectorAll('[data-panel-tab]'))button.addEventListener('click',()=>{adventureTab=button.dataset.panelTab;renderAdventure();});
$('closeFishPanel').onclick=()=>$('fishPanel').close();$('fishPanel').addEventListener('close',()=>{if(panelResume)setPaused(false);panelResume=false;canvas.focus({preventScroll:true});});
$('panelBody').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.fishDetail)showFishDetail(button.dataset.fishDetail);
 else if(button.hasAttribute('data-back'))renderAdventure();
 else if(button.hasAttribute('data-show-guide')){adventureTab='guide';renderAdventure();}
 else if(button.dataset.upgrade){const result=FP.upgrade(progress,button.dataset.upgrade);announce(result.message);if(result.ok)saveProgress();renderAdventure();}
 else if(button.hasAttribute('data-complete')){const result=FP.complete(progress);announce(result.message);if(result.ok)saveProgress();renderAdventure();}
 else if(button.dataset.travel!==undefined){if(!['idle','result'].includes(game.mode)){announce('完成当前抛竿后再出航。');return;}const result=FP.travel(progress,Number(button.dataset.travel));if(result.ok){game.mode='idle';game.reeling=game.result=game.biteFish=null;game.castToken='';clearInput();applyWater();saveProgress();}announce(result.message);renderAdventure();}
});
$('manualSave').onclick=()=>{saveProgress();announce(saveNotice);};$('newJourney').onclick=()=>$('resetJourney').showModal();$('cancelJourneyReset').onclick=()=>$('resetJourney').close();$('confirmJourneyReset').onclick=()=>{progress=FP.create();game.mode='idle';game.reeling=game.result=game.biteFish=null;game.castToken='';clearInput();applyWater();saveProgress();adventureTab='bag';renderAdventure();$('resetJourney').close();announce('新的湖域旅程已开始。');};

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if(!paused&&!document.hidden)update(dt);
  syncControls();if(!paused||drawDirty){draw();drawDirty=false;}
  requestAnimationFrame(loop);
}
cameraReady=true;applyWater();syncControls();if(saveNotice.startsWith('旧存档')||saveNotice.startsWith('保存失败'))announce(saveNotice);requestAnimationFrame(loop);

})();
</script>
