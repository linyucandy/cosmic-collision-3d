<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宇宙碰撞模拟器 · Cosmic Collision Simulator</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #e9eefc;
    --muted: #7f8aa6;
    --line: rgba(255, 255, 255, 0.10);
    --warm: #ffc083;
    --cool: #8fd0ff;
    --mono: "Cascadia Mono", "SFMono-Regular", ui-monospace, "Consolas", monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #04060d;
    color: var(--ink);
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  canvas { display: block; }
  #stage { position: fixed; inset: 0; z-index: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #bg { z-index: 0; }
  #fx { z-index: 1; }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.58) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.34), transparent 16%, transparent 76%, rgba(0,0,0,0.5));
  }
  .scan {
    position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0.28;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  /* top bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6;
    padding: 26px 32px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 22px; pointer-events: none;
    animation: fadeDown 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  .brand { flex: 0 0 auto; }
  .kicker {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; color: #93a0ba;
  }
  .kicker .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #ffb26e;
    box-shadow: 0 0 10px #ff9f4d; animation: pulse 2.4s ease-in-out infinite;
  }
  h1 {
    margin: 10px 0 5px; font-size: clamp(24px, 2.6vw, 34px); font-weight: 300;
    letter-spacing: 0.15em; line-height: 1.1;
    background: linear-gradient(100deg, #ffffff 18%, #ffdcb4 56%, #ffb277 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 20px rgba(255, 170, 100, 0.16));
  }
  h1 span { font-weight: 500; }
  .en {
    margin: 0; font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.38em; color: #66728c;
  }
  .telemetry {
    display: flex; align-items: stretch; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, rgba(13,18,32,0.58), rgba(7,10,18,0.38));
    border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(130%);
    box-shadow: 0 16px 50px rgba(0,0,0,0.32);
  }
  .stat {
    min-width: 112px; padding: 10px 17px 11px 16px;
    display: flex; flex-direction: column; gap: 5px;
    border-left: 1px solid rgba(255,255,255,0.07);
  }
  .stat:first-child { border-left: none; }
  .stat .label {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.16em; color: #727e98;
    white-space: nowrap;
  }
  .stat .value {
    display: flex; align-items: baseline; gap: 4px;
    font-family: var(--mono); font-size: 16px; line-height: 1; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em; white-space: nowrap;
  }
  .stat .value span { font-size: 9px; color: #7f8aa6; letter-spacing: 0.08em; }
  .stat.state { min-width: 126px; }
  .stat.state .value {
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    font-size: 11px; letter-spacing: 0.06em; color: var(--warm);
  }
  .stat.state .value span {
    font-family: var(--mono); font-size: 7.5px; letter-spacing: 0.1em;
    color: #7f8aa6; margin-left: 5px;
  }

  /* control dock */
  .dock {
    position: fixed; left: 26px; bottom: 24px; width: 354px; z-index: 7;
    padding: 16px 17px 15px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.11);
    background: linear-gradient(155deg, rgba(19,24,40,0.84), rgba(7,10,19,0.74));
    backdrop-filter: blur(26px) saturate(130%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: fadeUp 1s 0.15s cubic-bezier(.2,.8,.2,1) both;
    max-height: calc(100vh - 48px); overflow-y: auto; scrollbar-width: none;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock::before {
    content: ""; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    background: radial-gradient(120% 60% at 0% 0%, rgba(255,178,110,0.08), transparent 55%);
  }
  .dock-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .dock-title { font-size: 12px; letter-spacing: 0.18em; color: #dfe7f7; }
  .dock-sub {
    margin-left: auto; font-family: var(--mono); font-size: 8px;
    letter-spacing: 0.16em; color: #6b7894;
  }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .preset {
    appearance: none; font-family: inherit; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    background: rgba(255,255,255,0.035); color: #9faac2;
    font-size: 11px; letter-spacing: 0.05em; padding: 8px 6px;
    transition: background .2s, border-color .2s, color .2s, box-shadow .2s;
  }
  .preset:hover { border-color: rgba(255,190,120,0.35); color: #ffe0bd; background: rgba(255,190,120,0.06); }
  .preset.active {
    border-color: rgba(255,190,120,0.55); color: #ffe2c4;
    background: linear-gradient(180deg, rgba(255,185,115,0.16), rgba(255,185,115,0.07));
    box-shadow: inset 0 0 0 1px rgba(255,200,140,0.08), 0 0 18px rgba(255,170,90,0.08);
  }
  .field { display: block; margin-bottom: 10px; }
  .field:last-of-type { margin-bottom: 14px; }
  .field-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 3px; font-size: 10.5px; letter-spacing: 0.06em; color: #b6c1d8;
  }
  .field-top em {
    font-style: normal; font-family: var(--mono); font-size: 7.5px;
    letter-spacing: 0.12em; color: #69758f; margin-left: 6px;
  }
  .val { font-family: var(--mono); font-size: 10px; color: #ffd0a0; letter-spacing: 0.02em; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 20px; margin: 0; padding: 0;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px; border-radius: 2px;
    background: linear-gradient(90deg,
      rgba(255,184,119,0.95) 0%,
      rgba(255,159,95,0.95) var(--p, 0%),
      rgba(255,255,255,0.13) var(--p, 0%),
      rgba(255,255,255,0.13) 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
    background: #ffd3a0; border: 0;
    box-shadow: 0 0 0 3px rgba(255,180,110,0.12), 0 0 12px rgba(255,170,90,0.7);
  }
  input[type="range"]::-moz-range-track {
    height: 2px; border-radius: 2px; background: rgba(255,255,255,0.13);
  }
  input[type="range"]::-moz-range-progress { height: 2px; border-radius: 2px; background: #ff9f5f; }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border: 0; border-radius: 50%; background: #ffd3a0;
    box-shadow: 0 0 12px rgba(255,170,90,0.7);
  }
  .actions { display: flex; gap: 7px; }
  .btn {
    appearance: none; font-family: inherit; cursor: pointer;
    height: 36px; padding: 0 11px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.045);
    color: #c4cee2; font-size: 11px; letter-spacing: 0.05em;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .18s, color .18s, border-color .18s, filter .18s;
  }
  .btn:hover { background: rgba(255,255,255,0.085); color: #fff; }
  .btn.primary {
    flex: 1; border: none; color: #1e1408; font-weight: 600; letter-spacing: 0.08em;
    background: linear-gradient(100deg, #ffc589, #ff9d5f);
    box-shadow: 0 8px 26px rgba(255,150,80,0.18);
  }
  .btn.primary:hover { filter: brightness(1.12); }
  .icon-btn { width: 38px; padding: 0; font-size: 13px; }
  .icon-btn.active {
    color: #ffd2a4; border-color: rgba(255,190,120,0.45);
    background: rgba(255,180,110,0.12);
  }
  .playglyph { font-size: 9px; letter-spacing: -1.5px; }
  .hint {
    position: fixed; bottom: 27px; left: 50%; transform: translateX(-50%);
    z-index: 5; display: flex; gap: 18px; pointer-events: none; white-space: nowrap;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em;
    color: rgba(178,193,220,0.4);
    animation: hintFade 1.2s 9s forwards;
  }
  .hint span + span::before { content: "/"; margin-right: 18px; color: rgba(255,255,255,0.16); }
  .legend {
    position: fixed; right: 30px; bottom: 28px; z-index: 5; pointer-events: none;
    display: flex; gap: 18px; font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.1em; color: #818da6;
    animation: fadeUp 1s 0.4s cubic-bezier(.2,.8,.2,1) both;
  }
  .legend span { display: flex; align-items: center; white-space: nowrap; }
  .legend i {
    width: 6px; height: 6px; border-radius: 50%; margin-right: 7px;
    background: var(--c); box-shadow: 0 0 8px var(--c);
  }
  .legend .white { --c: #fff1d8; }

  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes hintFade { to { opacity: 0; } }

  @media (max-width: 760px) {
    .topbar { padding: 16px; flex-direction: column; gap: 12px; }
    h1 { font-size: 21px; margin-top: 7px; }
    .en { font-size: 8px; letter-spacing: .25em; }
    .telemetry { align-self: stretch; }
    .stat { flex: 1; min-width: 0; padding: 9px 10px 10px; }
    .stat .label { font-size: 7.5px; letter-spacing: 0.10em; }
    .lab-en { display: none; }
    .stat .value { font-size: 13px; }
    .stat.state { min-width: 0; }
    .stat.state .value { font-size: 10px; }
    .stat.state .value span { display: none; }
    .dock { left: 12px; right: 12px; bottom: 12px; width: auto; padding: 13px 14px 12px; }
    .presets { gap: 5px; margin-bottom: 11px; }
    .preset { font-size: 10px; padding: 7px 4px; }
    .field { margin-bottom: 8px; }
    .hint, .legend { display: none; }
  }
  @media (max-height: 700px) and (min-width: 761px) {
    .dock { padding: 12px 15px; }
    .presets { margin-bottom: 9px; }
    .field { margin-bottom: 7px; }
  }
</style>
</head>
<body>
<script src="experience-nav.js"></script>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>
</div>
<div class="vignette"></div>
<div class="scan"></div>

<header class="topbar">
  <div class="brand">
    <div class="kicker"><span class="dot"></span> SIMULATION 01 · GALAXY MERGER</div>
    <h1>宇宙<span>碰撞</span>模拟器</h1>
    <p class="en">COSMIC COLLISION SIMULATOR</p>
  </div>
  <div class="telemetry">
    <div class="stat">
      <span class="label"><span class="lab-en">TIME / </span>时间</span>
      <span class="value" id="statTime">0 <span>Myr</span></span>
    </div>
    <div class="stat">
      <span class="label"><span class="lab-en">SEPARATION / </span>核心间距</span>
      <span class="value" id="statSep">79.2 <span>kpc</span></span>
    </div>
    <div class="stat">
      <span class="label"><span class="lab-en">V-REL / </span>相对速度</span>
      <span class="value" id="statSpeed">720 <span>km/s</span></span>
    </div>
    <div class="stat state">
      <span class="label"><span class="lab-en">STATE / </span>状态</span>
      <span class="value" id="statState">引力接近 <span>APPROACH</span></span>
    </div>
  </div>
</header>

<aside class="dock" id="dock">
  <div class="dock-head">
    <span class="dock-title">碰撞参数</span>
    <span class="dock-sub">COLLISION SETUP</span>
  </div>

  <div class="presets">
    <button class="preset active" data-preset="headon">正面对撞</button>
    <button class="preset" data-preset="graze">擦肩而过</button>
    <button class="preset" data-preset="fast">高速掠袭</button>
    <button class="preset" data-preset="retro">反向旋涡</button>
  </div>

  <label class="field">
    <span class="field-top"><span>偏心距 <em>IMPACT</em></span><span class="val" id="bVal">0.0 kpc</span></span>
    <input id="impact" type="range" min="0" max="380" step="2" value="0" aria-label="碰撞偏心距">
  </label>
  <label class="field">
    <span class="field-top"><span>相对速度 <em>VELOCITY</em></span><span class="val" id="vVal">720 km/s</span></span>
    <input id="relV" type="range" min="25" max="130" step="1" value="60" aria-label="相对速度">
  </label>
  <label class="field">
    <span class="field-top"><span>引力强度 <em>GRAVITY</em></span><span class="val" id="gVal">×1.00</span></span>
    <input id="gravity" type="range" min="0.5" max="1.8" step="0.05" value="1" aria-label="引力强度">
  </label>
  <label class="field">
    <span class="field-top"><span>星体密度 <em>PARTICLES</em></span><span class="val" id="nVal">3.2k</span></span>
    <input id="density" type="range" min="800" max="2600" step="200" value="1600" aria-label="星体数量">
  </label>

  <div class="actions">
    <button class="btn primary" id="play"><span class="playglyph" id="playIcon">❚❚</span><span id="playLabel">暂停</span></button>
    <button class="btn" id="reset"><span>↺</span>重置</button>
    <button class="btn icon-btn active" id="trail" title="星轨拖影" aria-label="切换星轨">✦</button>
    <button class="btn icon-btn" id="view" title="重置视角" aria-label="重置视角">⌖</button>
  </div>
</aside>

<div class="hint">
  <span>拖拽平移</span><span>滚轮缩放</span><span>空格暂停</span><span>R 重置</span>
</div>
<div class="legend">
  <span><i style="--c:#ffbd7a"></i>星系 A</span>
  <span><i style="--c:#8fd0ff"></i>星系 B</span>
  <span><i class="white"></i>并合核心</span>
</div>

<script>
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const $ = (id) => document.getElementById(id);
  const bgCanvas = $('bg');
  const fxCanvas = $('fx');
  const bg = bgCanvas.getContext('2d');
  const fx = fxCanvas.getContext('2d');

  let W = 0, H = 0, DPR = 1, baseScale = 1, homeY = 0;
  const CAM = { x: 0, y: 0, zoom: 1 };

  const A_CORE = 62;
  const A2 = A_CORE * A_CORE;
  const CORE_MASS = 900000;
  const SEP = 880;

  const state = {
    running: true,
    t: 0,
    particles: [],
    cores: [],
    bursts: [],
    effects: [],
    G: 1,
    impact: 0,
    relV: 60,
    spinB: 1,
    count: 1600,
    merged: false,
    trail: true,
    shake: 0,
    passCount: 0,
    trend: 'in',
    lastSep: SEP,
    minSep: SEP,
    dirty: true,
    fade: 0.07
  };

  const PAL_A = [
    { c: [255, 214, 158], w: 0.22 },
    { c: [255, 190, 118], w: 0.22 },
    { c: [255, 236, 210], w: 0.18 },
    { c: [255, 160, 96], w: 0.12 },
    { c: [255, 150, 200], w: 0.08 },
    { c: [188, 208, 255], w: 0.10 },
    { c: [255, 250, 240], w: 0.08 }
  ];
  const PAL_B = [
    { c: [204, 232, 255], w: 0.23 },
    { c: [150, 196, 255], w: 0.24 },
    { c: [104, 150, 255], w: 0.13 },
    { c: [126, 240, 255], w: 0.14 },
    { c: [178, 142, 255], w: 0.09 },
    { c: [255, 226, 186], w: 0.10 },
    { c: [255, 160, 205], w: 0.07 }
  ];
  const BURST_PAL = [
    { c: [255, 246, 224], w: 0.34 },
    { c: [255, 204, 138], w: 0.22 },
    { c: [255, 160, 110], w: 0.12 },
    { c: [160, 219, 255], w: 0.20 },
    { c: [255, 176, 210], w: 0.12 }
  ];

  function weightedPick(pal) {
    let roll = Math.random();
    for (let i = 0; i < pal.length; i++) {
      if (roll < pal[i].w) return pal[i].c;
      roll -= pal[i].w;
    }
    return pal[pal.length - 1].c;
  }

  function gauss() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------------- sprites ---------------- */

  const spriteCache = new Map();
  function getSprite(c) {
    const key = c[0] + '_' + c[1] + '_' + c[2];
    let s = spriteCache.get(key);
    if (s) return s;
    const size = 64;
    s = document.createElement('canvas');
    s.width = size;
    s.height = size;
    const g = s.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,0.98)');
    grd.addColorStop(0.10, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.92)');
    grd.addColorStop(0.30, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.34)');
    grd.addColorStop(0.60, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.08)');
    grd.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(32, 32, 32, 0, TAU);
    g.fill();
    spriteCache.set(key, s);
    return s;
  }

  /* ---------------- background ---------------- */

  function drawBackground() {
    bg.clearRect(0, 0, W, H);
    const base = bg.createLinearGradient(0, 0, W * 0.35, H);
    base.addColorStop(0, '#050710');
    base.addColorStop(0.52, '#080b17');
    base.addColorStop(1, '#04050b');
    bg.fillStyle = base;
    bg.fillRect(0, 0, W, H);

    const nebula = (x, y, r, color) => {
      const g = bg.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(0.55, color.replace(/[\d.]+\)$/, '0.018)'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bg.fillStyle = g;
      bg.fillRect(x - r, y - r, r * 2, r * 2);
    };
    nebula(W * 0.20, H * 0.34, W * 0.50, 'rgba(255,150,82,0.075)');
    nebula(W * 0.83, H * 0.62, W * 0.55, 'rgba(80,140,255,0.070)');
    nebula(W * 0.52, H * 0.02, W * 0.62, 'rgba(118,76,200,0.055)');

    // faint galactic band
    bg.save();
    bg.translate(W * 0.5, H * 0.5);
    bg.rotate(-0.42);
    const band = bg.createLinearGradient(0, -H * 0.34, 0, H * 0.34);
    band.addColorStop(0, 'rgba(120,150,220,0)');
    band.addColorStop(0.45, 'rgba(150,175,235,0.035)');
    band.addColorStop(0.55, 'rgba(200,190,230,0.028)');
    band.addColorStop(1, 'rgba(120,150,220,0)');
    bg.fillStyle = band;
    bg.fillRect(-W * 0.8, -H * 0.34, W * 1.6, H * 0.68);
    bg.restore();

    const starCount = Math.round((W * H) / 2300);
    for (let i = 0; i < starCount; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const s = Math.random() < 0.9 ? 0.6 + Math.random() * 0.8 : 1.2 + Math.random() * 1.1;
      const a = 0.12 + Math.random() * 0.55;
      const tint = Math.random();
      bg.fillStyle = tint < 0.72
        ? 'rgba(210,225,255,' + a + ')'
        : (tint < 0.9 ? 'rgba(255,226,190,' + a + ')' : 'rgba(160,205,255,' + a + ')');
      bg.fillRect(x, y, s, s);
    }

    for (let i = 0; i < 11; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 5 + Math.random() * 11;
      const g = bg.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(235,245,255,0.34)');
      g.addColorStop(0.28, 'rgba(190,220,255,0.10)');
      g.addColorStop(1, 'rgba(150,190,255,0)');
      bg.fillStyle = g;
      bg.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }

  /* ---------------- simulation setup ---------------- */

  function enclosedMass(r) {
    const r2 = r * r;
    return CORE_MASS * (r * r2) / Math.pow(r2 + A2, 1.5);
  }

  function circSpeed(r) {
    return Math.sqrt(state.G * enclosedMass(r) / Math.max(r, 1));
  }

  function createGalaxy(core, n, spin, pal, phase) {
    for (let i = 0; i < n; i++) {
      const roll = Math.random();
      let r, theta, vt, vr, size, alpha, dust = false;

      if (roll < 0.15) {
        // bulge — pressure supported and warm
        r = 2.5 + Math.abs(gauss()) * 25;
        theta = Math.random() * TAU;
        const vc = circSpeed(r);
        vt = vc * (0.35 + Math.random() * 0.30) * spin;
        vr = vc * gauss() * 0.38;
        size = 0.85 + Math.pow(Math.random(), 2) * 2.4;
        alpha = 0.55 + Math.random() * 0.40;
        if (Math.random() < 0.09) { size *= 1.6; alpha = 0.95; }
      } else if (roll < 0.21) {
        // sparse halo
        r = 145 + Math.random() * 135;
        theta = Math.random() * TAU;
        const vc = circSpeed(r);
        vt = vc * (0.45 + Math.random() * 0.30) * spin;
        vr = vc * gauss() * 0.30;
        size = 0.7 + Math.random() * 1.5;
        alpha = 0.22 + Math.random() * 0.35;
      } else {
        // exponential disk with three logarithmic arms
        r = 18 - Math.log(1 - Math.random()) * 70;
        if (r > 238) r = 238 - Math.random() * 26;
        const arm = Math.floor(Math.random() * 3);
        theta = arm * TAU / 3 + Math.log((r + 12) / 26) * 2.95 * spin
          + gauss() * 0.30 + phase + (Math.random() - 0.5) * 0.22;
        const vc = circSpeed(r);
        vt = vc * (0.94 + Math.random() * 0.09);
        vr = vc * gauss() * 0.035;
        dust = Math.random() < 0.14;
        if (dust) {
          size = 3.4 + Math.random() * 7.5;
          alpha = 0.055 + Math.random() * 0.045;
        } else {
          size = 0.62 + Math.pow(Math.random(), 2) * 1.85;
          alpha = 0.38 + Math.random() * 0.48;
          if (Math.random() < 0.022) { size *= 1.75; alpha = 0.95; }
        }
      }

      const cos = Math.cos(theta);
      const sin = Math.sin(theta);
      const tx = -sin * spin;
      const ty = cos * spin;
      state.particles.push({
        x: core.x + cos * r,
        y: core.y + sin * r,
        vx: core.vx + tx * vt + cos * vr,
        vy: core.vy + ty * vt + sin * vr,
        s: size,
        a: alpha,
        c: weightedPick(pal),
        dust: dust
      });
    }
  }

  function resetSim() {
    state.t = 0;
    state.merged = false;
    state.passCount = 0;
    state.trend = 'in';
    state.shake = 0;
    state.effects.length = 0;
    state.particles.length = 0;
    state.bursts.length = 0;

    const b = state.impact;
    const v = state.relV;
    const a = {
      x: -SEP / 2, y: -b / 2, vx: v / 2, vy: 0,
      m: CORE_MASS, c: [255, 204, 140], a2: A2
    };
    const bb = {
      x: SEP / 2, y: b / 2, vx: -v / 2, vy: 0,
      m: CORE_MASS, c: [142, 205, 255], a2: A2
    };
    state.cores = [a, bb];
    createGalaxy(a, state.count, 1, PAL_A, 0.35);
    createGalaxy(bb, state.count, state.spinB, PAL_B, 2.05);

    state.lastSep = Math.hypot(bb.x - a.x, bb.y - a.y);
    state.minSep = state.lastSep;
    state.dirty = true;
    fx.clearRect(0, 0, W, H);
    updateHUD();
  }

  /* ---------------- physics ---------------- */

  function addRing(x, y, maxR, color, life) {
    state.effects.push({ kind: 'ring', x: x, y: y, r: 8, maxR: maxR, color: color, life: life, life0: life });
  }

  function spawnBurst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * TAU;
      const sp = 24 + Math.pow(Math.random(), 1.4) * 170;
      const off = 4 + Math.random() * 34;
      state.bursts.push({
        x: x + Math.cos(ang) * off,
        y: y + Math.sin(ang) * off,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        s: 0.5 + Math.random() * 1.5,
        a: 0.55 + Math.random() * 0.35,
        c: weightedPick(BURST_PAL),
        life: 1.5 + Math.random() * 1.7
      });
    }
  }

  function mergeCores() {
    const a = state.cores[0];
    const b = state.cores[1];
    const m = a.m + b.m;
    const x = (a.x * a.m + b.x * b.m) / m;
    const y = (a.y * a.m + b.y * b.m) / m;
    const vx = (a.vx * a.m + b.vx * b.m) / m;
    const vy = (a.vy * a.m + b.vy * b.m) / m;
    state.cores = [{ x: x, y: y, vx: vx, vy: vy, m: m, c: [255, 232, 200], merged: true, a2: 100 * 100 }];
    state.merged = true;
    state.shake = 22;

    // violent relaxation: heat the stellar orbits so the remnant is a puffy elliptical
    const ps = state.particles;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.vx = vx + (p.vx - vx) * 1.04 + gauss() * 8;
      p.vy = vy + (p.vy - vy) * 1.04 + gauss() * 8;
    }

    addRing(x, y, 860, '255,219,178', 1.55);
    addRing(x, y, 540, '158,220,255', 1.05);
    spawnBurst(x, y, 180);
  }

  function step(dt) {
    const cores = state.cores;

    if (cores.length === 2) {
      const a = cores[0];
      const b = cores[1];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      const d = Math.sqrt(d2) || 0.001;
      const f = state.G / Math.pow(d2 + A2, 1.5);

      a.vx += dx * f * b.m * dt;
      a.vy += dy * f * b.m * dt;
      b.vx -= dx * f * a.m * dt;
      b.vy -= dy * f * a.m * dt;

      // mild dynamical friction, lets bound pairs spiral together
      const damp = 0.05 * Math.exp(-d / 280);
      const rvx = a.vx - b.vx;
      const rvy = a.vy - b.vy;
      a.vx -= rvx * damp * dt;
      a.vy -= rvy * damp * dt;
      b.vx += rvx * damp * dt;
      b.vy += rvy * damp * dt;

      a.x += a.vx * dt;
      a.y += a.vy * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (dx * dx + dy * dy < 22 * 22) mergeCores();
    }

    const cs = state.cores;
    const particles = state.particles;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      let ax = 0, ay = 0;
      for (let k = 0; k < cs.length; k++) {
        const c = cs[k];
        const dx = c.x - p.x;
        const dy = c.y - p.y;
        const d2 = dx * dx + dy * dy;
        const inv = state.G * c.m / Math.pow(d2 + c.a2, 1.5);
        ax += dx * inv;
        ay += dy * inv;
      }
      p.vx += ax * dt;
      p.vy += ay * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    // short-lived merger sparks
    const bursts = state.bursts;
    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i];
      let ax = 0, ay = 0;
      for (let k = 0; k < cs.length; k++) {
        const c = cs[k];
        const dx = c.x - p.x;
        const dy = c.y - p.y;
        const d2 = dx * dx + dy * dy;
        const inv = state.G * c.m / Math.pow(d2 + c.a2, 1.5);
        ax += dx * inv;
        ay += dy * inv;
      }
      p.vx += ax * dt;
      p.vy += ay * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 0.52;
      if (p.life <= 0) bursts.splice(i, 1);
    }

    state.t += dt;

    if (state.cores.length === 2) {
      const a = state.cores[0];
      const b = state.cores[1];
      const sep = Math.hypot(b.x - a.x, b.y - a.y);
      if (state.trend === 'in' && sep > state.lastSep + 0.08) {
        state.trend = 'out';
        state.passCount++;
        if (state.lastSep < 250) {
          addRing((a.x + b.x) / 2, (a.y + b.y) / 2, 300, '255,207,164', 0.7);
          state.shake = Math.max(state.shake, 5);
        }
      } else if (state.trend === 'out' && sep < state.lastSep - 0.08) {
        state.trend = 'in';
      }
      state.lastSep = sep;
      state.minSep = Math.min(state.minSep, sep);
    }

    for (let i = state.effects.length - 1; i >= 0; i--) {
      const e = state.effects[i];
      e.life -= dt * (e.kind === 'ring' ? 0.52 : 1.4);
      if (e.kind === 'ring') {
        e.r += (e.maxR - e.r) * 2.6 * dt + 22 * dt;
      }
      if (e.life <= 0) state.effects.splice(i, 1);
    }

    state.shake *= Math.exp(-3.2 * dt);
    if (state.shake < 0.05) state.shake = 0;
  }

  /* ---------------- render ---------------- */

  function drawScene() {
    const S = baseScale * CAM.zoom;
    const shake = state.shake;
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;
    const originX = W / 2 - CAM.x * S + ox;
    const originY = H / 2 - CAM.y * S + oy;
    const particles = state.particles;
    const margin = 90;

    fx.globalCompositeOperation = 'lighter';

    // diffuse nebular dust
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (!p.dust) continue;
      const px = p.x * S + originX;
      const py = p.y * S + originY;
      if (px < -margin || py < -margin || px > W + margin || py > H + margin) continue;
      const size = p.s * 3.9 * S;
      fx.globalAlpha = p.a;
      fx.drawImage(getSprite(p.c), px - size / 2, py - size / 2, size, size);
    }

    // stars
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.dust) continue;
      const px = p.x * S + originX;
      const py = p.y * S + originY;
      if (px < -margin || py < -margin || px > W + margin || py > H + margin) continue;
      const size = p.s * 4.4 * S;
      fx.globalAlpha = p.a;
      fx.drawImage(getSprite(p.c), px - size / 2, py - size / 2, size, size);
    }

    // merger sparks — brief, additive and fading
    for (let i = 0; i < state.bursts.length; i++) {
      const p = state.bursts[i];
      const px = p.x * S + originX;
      const py = p.y * S + originY;
      if (px < -margin || py < -margin || px > W + margin || py > H + margin) continue;
      const size = p.s * 4.6 * S;
      fx.globalAlpha = p.a * Math.min(1, p.life * 1.4);
      fx.drawImage(getSprite(p.c), px - size / 2, py - size / 2, size, size);
    }

    // galactic cores
    for (let k = 0; k < state.cores.length; k++) {
      const c = state.cores[k];
      const px = c.x * S + originX;
      const py = c.y * S + originY;
      const pulse = c.merged ? 1 + 0.05 * Math.sin(state.t * 4) : 1 + 0.035 * Math.sin(state.t * 6 + k);
      const big = (c.merged ? 146 : 108) * S * pulse;
      fx.globalAlpha = 0.085;
      fx.drawImage(getSprite(c.c), px - big * 1.8, py - big * 1.8, big * 3.6, big * 3.6);
      fx.globalAlpha = 0.46;
      fx.drawImage(getSprite(c.c), px - big / 2, py - big / 2, big, big);
      fx.globalAlpha = 0.40;
      const inner = big * 0.20;
      fx.drawImage(getSprite([255, 248, 235]), px - inner / 2, py - inner / 2, inner, inner);
    }

    // shock rings
    for (let i = 0; i < state.effects.length; i++) {
      const e = state.effects[i];
      const px = e.x * S + originX;
      const py = e.y * S + originY;
      const life = Math.max(0, e.life / e.life0);
      fx.globalAlpha = life * 0.55;
      fx.strokeStyle = 'rgba(' + e.color + ',' + (life * 0.55).toFixed(3) + ')';
      fx.lineWidth = 1 + life * 2.4;
      fx.beginPath();
      fx.arc(px, py, Math.max(1, e.r * S), 0, TAU);
      fx.stroke();
      fx.globalAlpha = life * 0.22;
      fx.lineWidth = 5 + life * 8;
      fx.beginPath();
      fx.arc(px, py, Math.max(1, e.r * S * 0.94), 0, TAU);
      fx.stroke();
    }

    fx.globalAlpha = 1;
    fx.globalCompositeOperation = 'source-over';
  }

  function renderFrame(dtReal) {
    if (state.trail) {
      if (dtReal > 0) {
        state.fade = clamp(1 - Math.exp(-dtReal * 4.1), 0.025, 0.16);
      }
      fx.globalCompositeOperation = 'destination-out';
      fx.fillStyle = 'rgba(0,0,0,' + state.fade.toFixed(4) + ')';
      fx.fillRect(0, 0, W, H);
    } else {
      fx.clearRect(0, 0, W, H);
    }
    drawScene();
  }

  /* ---------------- HUD / UI ---------------- */

  function updateHUD() {
    const cores = state.cores;
    let sep = 0;
    let relSpeed = 0;
    if (cores.length === 2) {
      sep = Math.hypot(cores[1].x - cores[0].x, cores[1].y - cores[0].y);
      relSpeed = Math.hypot(cores[0].vx - cores[1].vx, cores[0].vy - cores[1].vy);
    }

    $('statTime').innerHTML = Math.round(state.t * 12) + ' <span>Myr</span>';
    $('statSep').innerHTML = (sep * 0.09).toFixed(1) + ' <span>kpc</span>';
    $('statSpeed').innerHTML = Math.round(relSpeed * 12) + ' <span>km/s</span>';

    let label = '引力接近';
    let en = 'APPROACH';
    if (state.merged) {
      label = '并合遗迹';
      en = 'REMNANT';
    } else if (sep < 150) {
      label = '潮汐撕裂';
      en = 'TIDAL';
    } else if (state.trend === 'out') {
      label = '潮汐分离';
      en = 'RECEDING';
    } else if (state.passCount > 0) {
      label = '再次接近';
      en = 'RETURN';
    }
    $('statState').innerHTML = label + ' <span>' + en + '</span>';
  }

  function updatePlayUI() {
    $('playLabel').textContent = state.running ? '暂停' : '播放';
    $('playIcon').textContent = state.running ? '❚❚' : '▶';
  }

  function setPresetActive(id) {
    document.querySelectorAll('.preset').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-preset') === id);
    });
  }

  function paintRange(input) {
    const min = parseFloat(input.min);
    const max = parseFloat(input.max);
    const p = ((parseFloat(input.value) - min) / (max - min)) * 100;
    input.style.setProperty('--p', p + '%');
  }

  function syncLabels() {
    $('bVal').textContent = (state.impact * 0.09).toFixed(1) + ' kpc';
    $('vVal').textContent = Math.round(state.relV * 12) + ' km/s';
    $('gVal').textContent = '×' + state.G.toFixed(2);
    $('nVal').textContent = ((state.count * 2) / 1000).toFixed(1) + 'k';
  }

  const PRESETS = {
    headon: { b: 0, v: 60, spin: 1 },
    graze: { b: 300, v: 55, spin: 1 },
    fast: { b: 200, v: 115, spin: 1 },
    retro: { b: 120, v: 65, spin: -1 }
  };

  const impactInput = $('impact');
  const relVInput = $('relV');
  const gravityInput = $('gravity');
  const densityInput = $('density');

  function applyPreset(id) {
    const p = PRESETS[id];
    if (!p) return;
    state.impact = p.b;
    state.relV = p.v;
    state.spinB = p.spin;
    impactInput.value = p.b;
    relVInput.value = p.v;
    paintRange(impactInput);
    paintRange(relVInput);
    syncLabels();
    setPresetActive(id);
    state.running = true;
    resetSim();
    updatePlayUI();
  }

  document.querySelectorAll('.preset').forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyPreset(btn.getAttribute('data-preset'));
    });
  });

  impactInput.addEventListener('input', function () {
    state.impact = parseFloat(impactInput.value);
    paintRange(impactInput);
    syncLabels();
    setPresetActive(null);
  });
  impactInput.addEventListener('change', function () {
    resetSim();
  });

  relVInput.addEventListener('input', function () {
    state.relV = parseFloat(relVInput.value);
    paintRange(relVInput);
    syncLabels();
    setPresetActive(null);
  });
  relVInput.addEventListener('change', function () {
    resetSim();
  });

  gravityInput.addEventListener('input', function () {
    state.G = parseFloat(gravityInput.value);
    paintRange(gravityInput);
    syncLabels();
  });

  densityInput.addEventListener('input', function () {
    state.count = parseInt(densityInput.value, 10);
    paintRange(densityInput);
    syncLabels();
  });
  densityInput.addEventListener('change', function () {
    resetSim();
  });

  $('play').addEventListener('click', function () {
    state.running = !state.running;
    if (state.running) state.dirty = false;
    updatePlayUI();
  });

  $('reset').addEventListener('click', function () {
    state.running = true;
    resetSim();
    updatePlayUI();
  });

  $('trail').addEventListener('click', function () {
    state.trail = !state.trail;
    this.classList.toggle('active', state.trail);
    if (!state.trail) fx.clearRect(0, 0, W, H);
    state.dirty = true;
  });

  $('view').addEventListener('click', resetView);

  /* ---------------- camera interactions ---------------- */

  function resetView() {
    CAM.x = 0;
    CAM.y = homeY;
    CAM.zoom = 1;
    state.dirty = true;
  }

  function zoomAt(cx, cy, factor) {
    const S = baseScale * CAM.zoom;
    const wx = (cx - W / 2) / S + CAM.x;
    const wy = (cy - H / 2) / S + CAM.y;
    CAM.zoom = clamp(CAM.zoom * factor, 0.45, 3.2);
    const S2 = baseScale * CAM.zoom;
    CAM.x = wx - (cx - W / 2) / S2;
    CAM.y = wy - (cy - H / 2) / S2;
    state.dirty = true;
  }

  window.addEventListener('wheel', function (e) {
    if (e.target.closest && e.target.closest('.dock')) return;
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012));
  }, { passive: false });

  const pointers = new Map();
  let dragging = false;
  let lastPX = 0, lastPY = 0;
  let pinchDist = 0;

  window.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.dock')) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragging = true;
      lastPX = e.clientX;
      lastPY = e.clientY;
      pinchDist = 0;
    } else if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      dragging = false;
    }
  });

  window.addEventListener('pointermove', function (e) {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX;
    p.y = e.clientY;

    if (pointers.size >= 2) {
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0 && d > 0) {
        const midX = (pts[0].x + pts[1].x) / 2;
        const midY = (pts[0].y + pts[1].y) / 2;
        zoomAt(midX, midY, d / pinchDist);
      }
      pinchDist = d;
      return;
    }

    if (!dragging) return;
    const S = baseScale * CAM.zoom;
    CAM.x -= (e.clientX - lastPX) / S;
    CAM.y -= (e.clientY - lastPY) / S;
    lastPX = e.clientX;
    lastPY = e.clientY;
    state.dirty = true;
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    pinchDist = 0;
    if (pointers.size === 0) dragging = false;
    else if (pointers.size === 1) {
      const p = Array.from(pointers.values())[0];
      lastPX = p.x;
      lastPY = p.y;
      dragging = true;
    }
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  window.addEventListener('dblclick', function (e) {
    if (e.target.closest && e.target.closest('.dock')) return;
    resetView();
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      state.running = !state.running;
      updatePlayUI();
    } else if (e.key === 'r' || e.key === 'R') {
      state.running = true;
      resetSim();
      updatePlayUI();
    }
  });

  /* ---------------- resize + loop ---------------- */

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    [bgCanvas, fxCanvas].forEach(function (canvas) {
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    });
    bg.setTransform(DPR, 0, 0, DPR, 0, 0);
    fx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const fitW = W < 760 ? W * 1.02 : W * 0.86;
    const fitH = W < 760 ? H * 0.62 : H * 0.84;
    baseScale = clamp(Math.min(fitW / 1360, fitH / 900), 0.24, 1.2);
    homeY = W < 760 ? (H * 0.07) / baseScale : 0;
    CAM.zoom = 1;
    CAM.x = 0;
    CAM.y = homeY;

    drawBackground();
    fx.clearRect(0, 0, W, H);
    state.dirty = true;
  }

  window.addEventListener('resize', resize);

  let lastTime = performance.now();
  let acc = 0;
  let hudClock = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    const raw = (now - lastTime) / 1000;
    lastTime = now;
    const dtReal = Math.min(0.05, raw);

    if (state.running) {
      acc += dtReal * 60;
      let iterations = 0;
      while (acc >= 1 && iterations < 4) {
        step(0.045);
        acc -= 1;
        iterations++;
      }
      if (iterations === 4) acc = 0;
      renderFrame(dtReal);

      hudClock += dtReal;
      if (hudClock > 0.12) {
        updateHUD();
        hudClock = 0;
      }
    } else if (state.dirty) {
      fx.clearRect(0, 0, W, H);
      drawScene();
      state.dirty = false;
    }
  }

  /* ---------------- boot ---------------- */

  [impactInput, relVInput, gravityInput, densityInput].forEach(paintRange);
  syncLabels();
  resize();
  resetSim();
  state.running = true;
  updatePlayUI();
  requestAnimationFrame(function (t) {
    lastTime = t;
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
